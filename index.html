<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>체스 오프닝 트레이너</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1e1e24" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="lib/chessboard-1.0.0.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>체스 오프닝 트레이너</h1>

<div id="mode-select">
  <button class="mode-btn" data-mode="white">화이트 (이탈리안 게임)</button>
  <button class="mode-btn" data-mode="black">블랙 (카로칸)</button>
  <button class="mode-btn" data-mode="mixed">섞어서 연습</button>
</div>

<div id="answer-mode-select">
  <label><input type="radio" name="answer-mode" value="reveal" /> 틀리면 바로 정답 보여주기</label>
  <label><input type="radio" name="answer-mode" value="retry" /> 맞힐 때까지 다시 시도 (정답 보기 버튼 사용)</label>
  <label><input type="checkbox" id="linename-toggle" /> 라인 이름 보기</label>
</div>

<div id="main">
  <div id="board-area">
    <div id="board"></div>
    <div id="status-box">
      <div id="line-name">라인을 시작하려면 위에서 모드를 선택하세요.</div>
      <div id="message"></div>
      <div id="explain-box" style="display:none;"></div>
      <button id="explain-btn" style="display:none;">이 수 설명 보기</button>
      <button id="skip-explain-btn" style="display:none;">설명 안 보고 넘어가기</button>
      <button id="continue-btn" style="display:none;">계속하기 →</button>
      <button id="show-answer-btn" style="display:none;">정답 보기</button>
      <button id="next-btn" style="display:none;">다음 라인 →</button>
    </div>
  </div>

  <div id="side-panel">
    <h2>진행 상황</h2>
    <div id="stats-summary"></div>
    <table id="stats-table">
      <thead><tr><th>라인</th><th>단계</th><th>복습 예정</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="backup-controls">
      <button id="export-btn">진행 상황 내보내기</button>
      <label id="import-label" for="import-input">진행 상황 가져오기</label>
      <input type="file" id="import-input" accept="application/json" style="display:none;" />
    </div>
    <button id="reset-btn">전체 학습 기록 초기화</button>
  </div>
</div>

<script src="lib/jquery-3.6.0.min.js"></script>
<script src="lib/chess.js"></script>
<script src="lib/chessboard-1.0.0.min.js"></script>
<script src="repertoire.js"></script>
<script src="trainer.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
