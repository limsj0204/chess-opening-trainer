<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>체스 오프닝 트레이너</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1e1e24" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="lib/chessboard-1.0.0.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>체스 오프닝 트레이너</h1>

<div id="mode-select">
  <button class="mode-btn" data-mode="white">화이트 (이탈리안 게임)</button>
  <button class="mode-btn" data-mode="black">블랙 (카로칸)</button>
  <button class="mode-btn" data-mode="mixed">섞어서 연습</button>
</div>

<div id="main">
  <div id="board-area">
    <div id="board"></div>
    <div id="status-box">
      <div id="line-name">라인을 시작하려면 위에서 모드를 선택하세요.</div>
      <div id="message"></div>
      <button id="next-btn" style="display:none;">다음 라인 →</button>
    </div>
  </div>

  <div id="side-panel">
    <h2>진행 상황</h2>
    <div id="stats-summary"></div>
    <table id="stats-table">
      <thead><tr><th>라인</th><th>단계</th><th>복습 예정</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="reset-btn">전체 학습 기록 초기화</button>
  </div>
</div>

<script src="lib/jquery-3.6.0.min.js"></script>
<script src="lib/chess.js"></script>
<script src="lib/chessboard-1.0.0.min.js"></script>
<script src="repertoire.js"></script>
<script src="trainer.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
